# =============================================================================
# Site Configuration
# =============================================================================

title: "cmolisee"
description: ""
baseurl: ""
url: ""

version: "2026.03.29"

# Build
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

# Defaults
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "blog"
  - scope:
      path: "_docs"
      type: "docs"
    values:
      layout: "doc"

collections:
  docs:
    output: true
    permalink: /docs/:name/

# Exclude from build
exclude:
  - assets/_css/
  - assets/_ts/
  - node_modules/
  - vendor/bundle/
  - package.json
  - package-lock.json
  - "*.config.mjs"
  - "*.config.js"
  - tsconfig.json
  - .prettierignore
  - markdownlint-cli2.mjs
  - "*.sh"
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-postcss-v2
  - jekyll-tsc

# Navigation — sidebar menu
nav:
  - title: "Docs"
    links:
      - label: "All Docs"
        url: "/docs/"
      - label: "Introduction"
        url: "/docs/introduction/"
      - label: "Installation"
        url: "/docs/installation/"
  - title: "Blog"
    links:
      - label: "All Posts"
        url: "/blog/"
