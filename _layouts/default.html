<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>

  <body class="flex min-h-screen flex-col">
    <!-- Top navigation bar -->
    {% include header.html %}

    <!-- Page body: sidebar + main content -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar (20% on desktop, off-canvas on mobile) -->
      {% include sidebar.html %}

      <!-- Main content area (80% on desktop) -->
      <main class="flex min-w-0 flex-1 flex-col lg:w-4/5">
        <div class="flex-1 px-6 py-8 md:px-10">
          {{ content }}
        </div>

        {% include footer.html %}
      </main>
    </div>

    <!-- Scripts -->
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
