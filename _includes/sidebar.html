<!-- Overlay (mobile only) -->
<div
  id="sidebar-overlay"
  class="fixed inset-0 z-raised bg-surface-raised/40 hidden lg:hidden"
  aria-hidden="true"
></div>

<!-- Sidebar panel -->
<aside
  id="sidebar"
  class="fixed bg-surface-raised inset-y-0 left-0 z-raised flex w-64 -translate-x-full flex-col border-r border-surface sidebar-transition lg:static lg:w-1/5 lg:translate-x-0 lg:min-w-[200px]"
  aria-label="Navigation"
>
  <!-- Mobile: sidebar header with close button -->
  <div
    class="flex h-14 shrink-0 items-center justify-between border-b border-surface px-4 lg:hidden"
  >
    <span class="text-sm font-semibold text-text-primary">{{ site.title }}</span>
    <button
      id="sidebar-close"
      type="button"
      aria-label="Close navigation"
      class="btn-link rounded-md p-1.5"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Nav content — scrollable -->
  <nav class="flex-1 overflow-y-auto px-3 pb-6 pt-4 text-sm">
    {% for section in site.nav %}
      <p class="nav-section-title">{{ section.title }}</p>
      <ul class="space-y-0.5">
        {% for link in section.links %}
          <li>
            <a href="{{ link.url | relative_url }}" class="nav-link">{{ link.label }}</a>
          </li>
        {% endfor %}
      </ul>
    {% endfor %}
  </nav>

  <!-- Sidebar footer — version badge -->
  <div class="shrink-0 border-t border-surface px-4 py-2.5">
    <span class="text-xs text-text-secondary">v{{ site.version }}</span>
  </div>
</aside>
