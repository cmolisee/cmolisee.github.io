<nav id="toc" aria-label="On this page" class="sticky top-20 hidden w-48 shrink-0 xl:block">
  <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-gray-400 dark:text-gray-600">
    On this page
  </p>
  <ul id="toc-list" class="space-y-1 text-sm"></ul>
</nav>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const article = document.getElementById("doc-content");
    const list = document.getElementById("toc-list");
    if (!article || !list) return;

    const headings = article.querySelectorAll("h2, h3");
    if (headings.length === 0) return;

    headings.forEach((h) => {
      if (!h.id) {
        h.id = h.textContent
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      }

      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = `#${h.id}`;
      a.textContent = h.textContent;
      a.className =
        h.tagName === "H3"
          ? "block pl-3 text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors"
          : "block text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors font-medium";
      li.appendChild(a);
      list.appendChild(li);
    });

    // Highlight active heading on scroll
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          const id = entry.target.getAttribute("id");
          const link = list.querySelector(`a[href="#${id}"]`);
          if (!link) return;
          if (entry.isIntersecting) {
            list
              .querySelectorAll("a")
              .forEach((a) => a.classList.remove("text-brand-600", "dark:text-brand-400"));
            link.classList.add("text-brand-600", "dark:text-brand-400");
          }
        });
      },
      { rootMargin: "0px 0px -60% 0px" }
    );

    headings.forEach((h) => observer.observe(h));
  });
</script>
