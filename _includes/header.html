<header
  class="sticky top-0 z-modal flex h-14 items-center border-b border-surface bg-surface-raised px-4"
>
  <!-- Mobile: hamburger button -->
  <button
    id="sidebar-open"
    type="button"
    aria-label="Open navigation"
    aria-expanded="false"
    aria-controls="sidebar"
    class="btn-link mr-3 p-1.5 lg:hidden!"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Site logo / name -->
  <a
    href="{{ '/' | relative_url }}"
    class="group btn-link gap-2 text-sm font-semibold pr-2"
  >
    <span
      class="flex h-7 w-7 items-center justify-center rounded-md bg-brand-accent text-xs font-bold text-surface"
    >
      {{ site.title | slice: 0 }}
    </span>
    <span class="group-hover:underline">{{ site.title }}</span>
  </a>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Right-side controls -->
  <nav class="flex items-center gap-1">
    <!-- Top-level links (optional, extend as needed) -->
    <a
      href="{{ '/docs/' | relative_url }}"
      class="btn-link px-3 py-1.5 text-sm hover:underline"
    >
      Docs
    </a>
    <a
      href="{{ '/blog/' | relative_url }}"
      class="btn-link px-3 py-1.5 text-sm hover:underline"
    >
      Blog
    </a>

    <!-- GitHub link (optional) -->
    <a
      href="https://github.com"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
      class="btn-link p-1.5"
    >
      <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
        <path
          fill-rule="evenodd"
          d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.749 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
          clip-rule="evenodd"
        />
      </svg>
    </a>

    <!-- Dark / light mode toggle -->
    <button
      data-theme-toggle
      type="button"
      aria-label="Toggle dark mode"
      class="btn-link p-1.5"
    >
      <!-- Moon icon — shown in light mode -->
      <svg
        data-icon-moon
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"
        />
      </svg>
      <!-- Sun icon — shown in dark mode -->
      <svg
        data-icon-sun
        xmlns="http://www.w3.org/2000/svg"
        class="hidden h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"
        />
      </svg>
    </button>
  </nav>
</header>
