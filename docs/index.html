---
layout: default
title: Docs
---
<div class="mx-auto">
  <header class="mb-10">
    <h1 class="mb-2 text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Blog</h1>
    <p class="text-gray-500 dark:text-gray-400">Notes and Knowledge.</p>
  </header>

  {% if site.docs.size > 0 %}
    <div class="space-y-4">
      {% for doc in site.docs %}
        {% include card.html content=doc %}
      {% endfor %}
    </div>
  {% else %}
    <p class="text-gray-500 dark:text-gray-400">
      No docs yet. Add Markdown files to
      <code>_docs/</code>
      .
    </p>
  {% endif %}
</div>
