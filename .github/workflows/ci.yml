name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  install:
    name: INSTALL DEPENDENCIES
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT
        uses: actions/checkout@v6
      - name: SET UP NODE
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
      - name: INSTALL NODE DEPENDENCIES
        run: npm ci
      - name: CACHE NODE_MODULES
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pakcage-lock.json') }}

  format:
    name: FORMAT CHECK
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: CHECKOUT
        uses: actions/checkout@v6
      - name: SET UP NODE
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: RESTORE NODE_MODULES
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: CHECK FORMATTING
        run: npm run format:check
      - name: CHECK MARKDOWN FORMATTING
        run: npm run format:md -- --check
  lint:
    name: LINT
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: CHECKOUT
        uses: actions/checkout@v6
      - name: SET UP NODE
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: RESTORE NODE_MODULES
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: LINT JS / TS / TSX
        run: npm run lint
      - name: LINT CSS
        run: npm run lint:css
      - name: LINT MARKDOWN
        run: npm run lint:md
