name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.9'
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci

  format-lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - name: FORMAT AND LINT
        run: | 
          npm run format
          npm run lint
      - name: AUTO COMMIT FORMAT AND LINT CHANGES
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-format and lint fixes"

  build:
    needs: [setup, format-lint]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.9'
          bundler-cache: true
      - name: SETUP PAGES
        id: pages
        uses: actions/configure-pages@v5
      - name: BUILD WITH JEKYLL
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: VALIDATE _SITE
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --checks Links,Images,Scripts \
            --allow_hash_href \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"
      - name: UPLOADE BUILD ARTIFACTS
        uses: actions/upload-pages-artifact@v3

  preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ADD PREVIEW TO PR IN COMMIT MESSAGE
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Preview Build Ready!**\n\nPreview changes [BUILD](${{ env.url }})._'
            })

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: DEPLOY GITHUB PAGES
        id: deployment
        uses: actions/deploy-pages@v5